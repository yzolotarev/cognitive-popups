name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  format:
    name: Rust formatting
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Install pinned Rust toolchain
        run: rustup show active-toolchain
      - run: cargo fmt --all -- --check

  build:
    name: Build and test (${{ matrix.platform }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: Linux
            runner: ubuntu-24.04
            executable: cognitive-exoskeleton
          - platform: Windows
            runner: windows-2022
            executable: cognitive-exoskeleton.exe
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Install Linux desktop build dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libfontconfig1-dev libxkbcommon-dev libwayland-dev libudev-dev libegl1-mesa-dev libdbus-1-dev
      - name: Install pinned Rust toolchain
        run: rustup show active-toolchain
      - uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: rust-${{ runner.os }}-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock', 'Cargo.toml') }}-${{ github.sha }}
          restore-keys: |
            rust-${{ runner.os }}-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock', 'Cargo.toml') }}-
      - run: cargo clippy --locked --workspace --all-targets --all-features -- -D warnings
      - run: cargo test --locked --workspace --all-targets --all-features
      - run: cargo build --locked --workspace --release
      - name: Smoke test executable
        run: ./target/release/${{ matrix.executable }} --help
      - name: Package and smoke install Linux
        if: runner.os == 'Linux'
        shell: bash
        run: |
          mkdir -p package/cognitive-exoskeleton-linux
          cp target/release/cognitive-exoskeleton packaging/linux/install.sh docs/user-guide.md LICENSE package/cognitive-exoskeleton-linux/
          tar -czf cognitive-exoskeleton-Linux-x86_64.tar.gz -C package cognitive-exoskeleton-linux
          test_home=$(mktemp -d)
          HOME="$test_home" XDG_DATA_HOME="$test_home/data" XDG_CONFIG_HOME="$test_home/config" sh package/cognitive-exoskeleton-linux/install.sh
          "$test_home/data/cognitive-exoskeleton-v1/bin/cognitive-exoskeleton" --help
          test ! -e "$test_home/config/autostart/cognitive-exoskeleton-v1.desktop"
      - name: Package Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force package/cognitive-exoskeleton-windows | Out-Null
          Copy-Item target/release/cognitive-exoskeleton.exe,packaging/windows/install.ps1,docs/user-guide.md,LICENSE package/cognitive-exoskeleton-windows/
          Compress-Archive -Path package/cognitive-exoskeleton-windows -DestinationPath cognitive-exoskeleton-Windows-x86_64.zip
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: cognitive-exoskeleton-${{ matrix.platform }}-x86_64
          path: |
            target/release/${{ matrix.executable }}
            cognitive-exoskeleton-${{ matrix.platform }}-x86_64.*
          if-no-files-found: error
          retention-days: 14

  audit:
    name: Dependency audit
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Install pinned Rust toolchain
        run: rustup show active-toolchain
      - run: cargo install cargo-audit --version 0.22.2 --locked
      - run: cargo audit
