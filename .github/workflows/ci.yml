name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  format:
    name: Rust formatting
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Install pinned Rust toolchain
        run: rustup show active-toolchain
      - run: cargo fmt --all -- --check

  build:
    name: Build and test (${{ matrix.platform }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: Linux
            runner: ubuntu-24.04
            executable: cognitive-exoskeleton
          - platform: Windows
            runner: windows-2022
            executable: cognitive-exoskeleton.exe
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Install pinned Rust toolchain
        run: rustup show active-toolchain
      - uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: rust-${{ runner.os }}-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock', 'Cargo.toml') }}-${{ github.sha }}
          restore-keys: |
            rust-${{ runner.os }}-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock', 'Cargo.toml') }}-
      - run: cargo clippy --locked --workspace --all-targets --all-features -- -D warnings
      - run: cargo test --locked --workspace --all-targets --all-features
      - run: cargo build --locked --workspace --release
      - name: Block trial CLI acceptance
        if: matrix.platform == 'Linux'
        run: python3 tools/b78-e2e.py target/release/cognitive-exoskeleton /tmp/b78-ci.db
      - name: Smoke test executable
        run: ./target/release/${{ matrix.executable }}
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: cognitive-exoskeleton-${{ matrix.platform }}-x86_64
          path: target/release/${{ matrix.executable }}
          if-no-files-found: error
          retention-days: 14

  desktop:
    name: Desktop (Linux)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        working-directory: apps/desktop
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Install pinned Rust toolchain
        run: rustup show active-toolchain
      - name: Install GTK 4, libadwaita and a headless compositor
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libgtk-4-dev libadwaita-1-dev meson ninja-build \
            libwayland-dev wayland-protocols sway grim wl-clipboard dbus fonts-inter
      - name: Build gtk4-layer-shell 1.1.1 (Ubuntu 24.04 has none)
        working-directory: ${{ runner.temp }}
        run: |
          git clone --depth 1 --branch v1.1.1 https://github.com/wmww/gtk4-layer-shell.git
          cd gtk4-layer-shell
          meson setup build --prefix=/usr -Dexamples=false -Ddocs=false -Dtests=false -Dsmoke-tests=false -Dintrospection=false -Dvapi=false
          sudo ninja -C build install
      - uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            apps/desktop/target
          key: desktop-${{ hashFiles('rust-toolchain.toml', 'apps/desktop/Cargo.lock') }}-${{ github.sha }}
          restore-keys: desktop-${{ hashFiles('rust-toolchain.toml', 'apps/desktop/Cargo.lock') }}-
      - run: cargo fmt -- --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo test --locked
      - run: cargo build --locked
      - name: Screenshots, light and dark
        run: tools/screenshots.sh "$RUNNER_TEMP/screenshots"
      - name: Build the headless practice CLI
        working-directory: .
        run: cargo build --locked
      - name: Learning feed episode, recovery and FSRS isolation
        run: ../../tools/learning-feed-e2e.sh "$RUNNER_TEMP/learning-feed-e2e"
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        if: always()
        with:
          name: desktop-screenshots
          path: |
            ${{ runner.temp }}/screenshots
            ${{ runner.temp }}/learning-feed-e2e
          retention-days: 14

  audit:
    name: Dependency audit
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Install pinned Rust toolchain
        run: rustup show active-toolchain
      - run: cargo install cargo-audit --version 0.22.2 --locked
      - run: cargo audit
