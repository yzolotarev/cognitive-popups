[package]
name = "cognitive-exoskeleton"
version = "0.1.0"
edition = "2024"
rust-version = "1.90"
publish = false

[dependencies]
cognitive-exoskeleton-ai = { path = "crates/ai" }
cognitive-exoskeleton-units = { path = "crates/units" }
cognitive-exoskeleton-memory = { path = "crates/memory" }
cognitive-exoskeleton-practice = { path = "crates/practice" }
cognitive-exoskeleton-capture = { path = "crates/capture" }
cognitive-exoskeleton-domain = { path = "crates/domain" }
cognitive-exoskeleton-journal = { path = "crates/journal" }
serde = { workspace = true }
serde_json = { workspace = true }
time = { workspace = true }

[workspace]
members = ["crates/*"]
resolver = "3"

[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
time = { version = "0.3", features = ["formatting", "parsing", "macros"] }
uuid = { version = "1.0", features = ["v4", "serde"] }
rusqlite = { version = "0.38", features = ["bundled"] }
