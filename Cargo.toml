[workspace]
members = ["crates/*"]
resolver = "3"

[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
time = { version = "0.3", features = ["formatting", "parsing", "macros"] }
uuid = { version = "1.0", features = ["v4", "serde"] }
rusqlite = { version = "0.38", features = ["bundled"] }
slint = "1.18"
