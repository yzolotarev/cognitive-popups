[package]
name = "cognitive-exoskeleton"
version = "0.1.0"
edition = "2024"
rust-version = "1.90"
publish = false

# Historical Rust package name is retained to avoid invalidating the lockfile.
# The published executable and UI use the current product name.
[[bin]]
name = "cognitive-popups"
path = "src/main.rs"

[workspace]
members = ["crates/*"]
resolver = "3"

[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
time = { version = "0.3", features = ["formatting", "parsing", "macros"] }
uuid = { version = "1.0", features = ["v4", "serde"] }
rusqlite = { version = "0.38", features = ["bundled"] }
