[package]
name = "cognitive-popups"
version = "0.1.0"
edition = "2024"
publish = false

# A separate workspace: the main one builds on Windows in CI and needs no GTK.
[workspace]

[dependencies]
adw = { version = "0.9.2", package = "libadwaita", features = ["v1_5"] }
cognitive-exoskeleton-capture = { path = "../../crates/capture" }
cognitive-exoskeleton-notes = { path = "../../crates/notes" }
gtk = { version = "0.11.5", package = "gtk4", features = ["v4_14"] }
gtk4-layer-shell = "0.8.1"
cognitive-exoskeleton-ai = { path = "../../crates/ai" }
cognitive-exoskeleton-domain = { path = "../../crates/domain" }
cognitive-exoskeleton-journal = { path = "../../crates/journal" }
cognitive-exoskeleton-understand = { path = "../../crates/understand" }
cognitive-exoskeleton-hypotheses = { path = "../../crates/hypotheses" }
cognitive-exoskeleton-lessons = { path = "../../crates/lessons" }
cognitive-exoskeleton-memory = { path = "../../crates/memory" }
cognitive-exoskeleton-nudges = { path = "../../crates/nudges" }
cognitive-exoskeleton-units = { path = "../../crates/units" }
cognitive-exoskeleton-practice = { path = "../../crates/practice" }
serde_json = "1.0"
time = "0.3"
ksni = { version = "0.3", features = ["blocking"] }
