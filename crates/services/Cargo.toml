[package]
name = "cognitive-exoskeleton-services"
version = "0.1.0"
edition = "2024"
rust-version = "1.90"
publish = false

[dependencies]
domain = { package = "cognitive-exoskeleton-domain", path = "../domain" }
journal = { package = "cognitive-exoskeleton-journal", path = "../journal" }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
rusqlite = { workspace = true }
uuid = { workspace = true }
time = { workspace = true }
reqwest = { version = "0.12.28", default-features = false, features = ["blocking", "json", "rustls-tls"] }
directories = "6"
zeroize = "1.8"
fsrs = "6.6.2"
getrandom = "0.4"
notify-rust = "4.11"

[target.'cfg(target_os = "linux")'.dependencies]
keyring = { version = "3.6.3", features = ["linux-native-sync-persistent", "crypto-rust"] }

[target.'cfg(target_os = "windows")'.dependencies]
keyring = { version = "3.6.3", features = ["windows-native"] }

[dev-dependencies]
tempfile = "3"
