# Cognitive Popups — Hyprland keybinds (conf syntax, opt-in example)
#
# Hyprland 0.56 with a Lua config (Ryoku) reads hyprland.lua next to this file
# instead: same five lines with `hl.bind(...)`.
#
# Include this file from your Hyprland config *only after* you have removed or
# disabled the old Cognitive Popups/Cognitive Exoskeleton binds for Alt+E /
# Alt+W / Alt+T / Ctrl+Alt+P / Alt+I. Two clients cannot both receive a key, and
# the legacy cognitive-exoskeleton scripts grab it from the focused XWayland
# window.
#
#   source = ~/.local/share/cognitive-popups/hyprland.conf
#
# The product itself never edits your compositor config.

bind = ALT, E, exec, cognitive-popups comment
bind = ALT, W, exec, cognitive-popups four-words
bind = ALT, T, exec, cognitive-popups task
bind = CTRL ALT, P, exec, cognitive-popups prediction
# Alt+I is the session window (timer + plan). It is not the control panel.
bind = ALT, I, exec, cognitive-popups session

# The five action windows float above the reader instead of being tiled.
windowrulev2 = float, class:^(cognitive-popups)$
