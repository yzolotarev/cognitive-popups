<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>tauri-probe</title>
    <style>
      html,
      body {
        margin: 0;
        background: transparent;
        overflow: hidden;
        font-family:
          Inter, "Noto Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
        -webkit-font-smoothing: antialiased;
      }
      .card {
        box-sizing: border-box;
        width: 420px;
        height: 150px;
        padding: 18px;
        border-radius: 14px;
        background: #17171ee8;
        border: 1px solid #ffffff22;
        box-shadow: 0 18px 40px #00000055;
        color: #f2f2f7;
      }
      .eyebrow {
        margin: 0 0 6px;
        color: #9aa0b4;
        font-size: 11px;
        letter-spacing: 1px;
      }
      .body {
        margin: 0;
        font-size: 17px;
        line-height: 1.35;
      }
    </style>
  </head>
  <body>
    <section class="card">
      <p class="eyebrow">Tauri probe</p>
      <p class="body">Проверка: наценка ≠ маржа. Кириллица, цифры 123.</p>
    </section>
  </body>
</html>
